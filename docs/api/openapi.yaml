components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: USER token signed with JWT_USER_SECRET and typ=USER.
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ADMIN token signed with JWT_ADMIN_SECRET and typ=ADMIN.
  parameters:
    FamilyID:
      name: familyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestID:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberID:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RelationshipID:
      name: relationshipId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    InvitationID:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ApplicationID:
      name: applicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MessageID:
      name: messageId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    BadRequest:
      description: Invalid JSON or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 10001
            message: 参数错误
            data: null
    Unauthorized:
      description: Missing, invalid, expired, wrong-type, or revoked token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 10008
            message: 登录已过期
            data: null
    BusinessError:
      description: Business rule failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SystemError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 10000
            message: 系统错误
            data: null
    AdminLoginError:
      description: Invalid credentials or unusable admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 47001
            message: 用户名或密码错误
            data: null
    AdminStateError:
      description: Admin is disabled, locked, or deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StatusOK:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusAPIResponse"
    InvitationOK:
      description: Invitation mutation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvitationAPIResponse"
    JoinRequestOK:
      description: Join-request mutation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JoinRequestAPIResponse"
    PublicApplicationOK:
      description: Public-display application mutation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicApplicationAPIResponse"
    VisitorMessageOK:
      description: Visitor message mutation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VisitorMessageAPIResponse"
    RoleChangeOK:
      description: Family role changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleChangeAPIResponse"
    FounderTransferOK:
      description: Founder transfer mutation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FounderTransferAPIResponse"
    AdminDissolutionOK:
      description: Family dissolution review succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminDissolutionAPIResponse"
  schemas:
    CreateInvitationRequest:
      type: object
      required: [inviteChannel]
      properties:
        inviteChannel:
          type: string
          enum: [SHARE_LINK, IN_APP]
        targetUserId:
          type: integer
          format: int64
        inviteMessage:
          type: string
          maxLength: 500
        familyRoleAfterAccept:
          type: string
          enum: [MEMBER]
    InvitationReasonRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    Invitation:
      type: object
      required: [invitationId, familyId, targetMemberId, inviteChannel, familyRoleAfterAccept, status, expiredAt, createdAt]
      properties:
        invitationId: {type: integer, format: int64}
        familyId: {type: integer, format: int64}
        familyName: {type: string}
        targetMemberId: {type: integer, format: int64}
        targetMemberName: {type: string}
        inviteChannel: {type: string, enum: [SHARE_LINK, IN_APP]}
        inviteMessage: {type: string}
        familyRoleAfterAccept: {type: string, enum: [MEMBER]}
        status: {type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, EXPIRED]}
        expiredAt: {type: string, format: date-time}
        acceptedAt: {type: string, format: date-time}
        rejectedAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    CreatedInvitation:
      type: object
      required: [invitation, inviteToken]
      properties:
        invitation: {$ref: "#/components/schemas/Invitation"}
        inviteToken:
          type: string
          description: Returned once and never stored in plaintext.
    InvitationAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Invitation"}
    CreatedInvitationAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/CreatedInvitation"}
    InvitationListAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/Invitation"}
    CreateJoinRequest:
      type: object
      properties:
        applicantRealName: {type: string, maxLength: 100}
        applicantMessage: {type: string, maxLength: 500}
    NewJoinMember:
      type: object
      required: [name]
      properties:
        name: {type: string}
        gender: {type: string, enum: [MALE, FEMALE, UNKNOWN]}
        birthDate: {type: string, format: date}
        birthYear: {type: integer}
        isAlive: {type: boolean}
        userBindingPolicy: {type: string, enum: [OPTIONAL, REQUIRED]}
    ApproveJoinRequest:
      type: object
      required: [approveMode]
      properties:
        approveMode:
          type: string
          enum: [BIND_EXISTING_MEMBER, CREATE_NEW_MEMBER]
        memberId: {type: integer, format: int64}
        newMember: {$ref: "#/components/schemas/NewJoinMember"}
        handleComment: {type: string, maxLength: 500}
    HandleJoinRequest:
      type: object
      properties:
        handleComment: {type: string, maxLength: 500}
    CancelJoinRequest:
      type: object
      properties:
        cancelReason: {type: string, maxLength: 500}
    JoinRequest:
      type: object
      required: [requestId, familyId, applicantUserId, requestStatus, createdAt, updatedAt]
      properties:
        requestId: {type: integer, format: int64}
        familyId: {type: integer, format: int64}
        familyName: {type: string}
        applicantUserId: {type: integer, format: int64}
        applicantRealName: {type: string}
        applicantMessage: {type: string}
        requestStatus: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        approveMode: {type: string, enum: [BIND_EXISTING_MEMBER, CREATE_NEW_MEMBER]}
        boundMemberId: {type: integer, format: int64}
        createdMemberId: {type: integer, format: int64}
        handleComment: {type: string}
        handledAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        graphVersion: {type: integer, format: int64}
    JoinRequestAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/JoinRequest"}
    JoinRequestListAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/JoinRequest"}
    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    StatusAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Status"
    ResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data: {}
    HealthResponse:
      allOf:

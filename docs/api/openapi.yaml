openapi: 3.0.3
info:
  title: Tree API
  version: 0.12.0
  description: API contract synchronized from the M1-M12 Go router, DTOs, VOs, handlers, and services.
servers:
  - url: http://127.0.0.1:8080/api
tags:
  - name: Health
  - name: Admin Auth
  - name: User Auth
  - name: WeChat Account
  - name: Family
  - name: Family Member
  - name: Family Relationship
  - name: Family Tree
  - name: Family Invitation
  - name: Family Join Request
  - name: Family Public Display
  - name: Visitor Message
  - name: Family Role
  - name: Founder Transfer
  - name: Family Dissolution
  - name: Family Restore
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AdminLoginError"
  /admin/auth/logout:
    post:
      tags: [Admin Auth]
      summary: Revoke current admin token
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SystemError"
  /admin/me:
    get:
      tags: [Admin Auth]
      summary: Get current admin
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfoAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminStateError"
  /admin/me/password:
    put:
      tags: [Admin Auth]
      summary: Change current admin password
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/send-code:
    post:
      tags: [User Auth]
      summary: Send phone verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
      responses:
        "200":
          description: Code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /auth/register-phone:
    post:
      tags: [User Auth]
      summary: Register with phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPhoneRequest"
      responses:
        "200":
          description: User created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /auth/login-phone:
    post:
      tags: [User Auth]
      summary: Login with phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPhoneRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BusinessError"
  /auth/logout:
    post:
      tags: [User Auth]
      summary: Revoke current user token
      security:
        - UserBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SystemError"
  /auth/wechat-mini/login:
    post:
      tags: [WeChat Account]
      summary: Login with WeChat Mini Program code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatMiniLoginRequest"
      responses:
        "200":
          description: Login succeeded or pending-phone-bind user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /auth/wechat-mini/bind-phone:
    post:
      tags: [WeChat Account]
      summary: Bind phone, claim account, or merge account
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindPhoneRequest"
      responses:
        "200":
          description: Phone bound; returns a new user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-phone:
    post:
      tags: [WeChat Account]
      summary: Change current user's phone
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePhoneRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/cancel-account:
    post:
      tags: [WeChat Account]
      summary: Cancel current user account
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /families:
    post:
      tags: [Family]
      summary: Create family
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetailAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Family]
      summary: List current user's families
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Active family memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyListAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SystemError"
  /families/{familyId}:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family]
      summary: Get member-visible family detail
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Family detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetailAPIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
    put:
      tags: [Family]
      summary: Update family base information
      description: publicDisplayStatus, familySurname, status, founder member, and graphVersion are not writable.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyRequest"
      responses:
        "200":
          description: Updated family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetailAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/public:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family]
      summary: Get public family information
      description: Returns code 42103 when the family is PRIVATE or otherwise not NORMAL and APPROVED.
      security: []
      responses:
        "200":
          description: Public family information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFamilyAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/dissolution-requests:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    post:
      tags: [Family]
      summary: Create family dissolution request
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDissolutionRequest"
      responses:
        "200":
          description: Pending request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DissolutionAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/dissolution-requests/current:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family]
      summary: Get current pending dissolution request
      description: data is null when no pending request exists.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Pending request or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableDissolutionAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/dissolution-requests/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Family]
      summary: Cancel pending family dissolution request
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDissolutionRequest"
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DissolutionAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/members:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    post:
      tags: [Family Member]
      summary: Create an unbound family member node
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created and graph version incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
    get:
      tags: [Family Member]
      summary: List active members in the current family
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Family member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/MemberID"
    get:
      tags: [Family Member]
      summary: Get active family member detail
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Member detail without sensitive user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
    put:
      tags: [Family Member]
      summary: Update member base information
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Member updated and graph version incremented when values are supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
    delete:
      tags: [Family Member]
      summary: Soft-delete a member
      security:
        - UserBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMemberRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/members/{memberId}/bind-user:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/MemberID"
    post:
      tags: [Family Member]
      summary: Bind an existing active user to a member
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindMemberUserRequest"
      responses:
        "200":
          description: User bound; graph version is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/members/{memberId}/unbind-user:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/MemberID"
    post:
      tags: [Family Member]
      summary: Unbind a non-privileged user link
      security:
        - UserBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnbindMemberUserRequest"
      responses:
        "200":
          description: User unbound; graph version is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/relationships:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    post:
      tags: [Family Relationship]
      summary: Create a member and relationship through an addType operation
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipRequest"
      responses:
        "201":
          description: Member and relationship created; graph version incremented once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipMutationAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/RelationshipID"
    put:
      tags: [Family Relationship]
      summary: Update relationship note or parent-link type
      description: fromMemberId, toMemberId, and relationshipType cannot be changed.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRelationshipRequest"
      responses:
        "200":
          description: Relationship updated and graph version incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipMutationAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
    delete:
      tags: [Family Relationship]
      summary: Soft-delete a relationship
      security:
        - UserBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRelationshipRequest"
      responses:
        "200":
          description: Relationship soft deleted and graph version incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipMutationAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/tree:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family Tree]
      summary: Get the private family tree
      description: Requires the current USER to be an active member of the family.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: LIST_TREE family-tree snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTreeAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "500":
          $ref: "#/components/responses/SystemError"
  /public/families/{familyId}/tree:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family Tree]
      summary: Get a public family tree
      description: Available only when family status is NORMAL and publicDisplayStatus is APPROVED.
      security: []
      responses:
        "200":
          description: Public-safe LIST_TREE family-tree snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTreeAPIResponse"
        "403":
          $ref: "#/components/responses/BusinessError"
        "500":
          $ref: "#/components/responses/SystemError"
  /families/{familyId}/members/{memberId}/invite:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/MemberID"
    post:
      tags: [Family Invitation]
      summary: Create a share-link or in-app invitation
      security: [{UserBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInvitationRequest"}
      responses:
        "201":
          description: Invitation created; the raw inviteToken is returned once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedInvitationAPIResponse"}
        "400": {$ref: "#/components/responses/BusinessError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/BusinessError"}
  /invitations/{inviteToken}:
    parameters:
      - name: inviteToken
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Family Invitation]
      summary: Get public-safe invitation details
      security: []
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationAPIResponse"}
        "404": {$ref: "#/components/responses/BusinessError"}
  /invitations/{invitationId}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationID"
    post:
      tags: [Family Invitation]
      summary: Accept an invitation and create an ACTIVE member link
      security: [{UserBearerAuth: []}]
      responses:
        "200": {$ref: "#/components/responses/InvitationOK"}
        "400": {$ref: "#/components/responses/BusinessError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/BusinessError"}
  /invitations/{invitationId}/reject:
    parameters:
      - $ref: "#/components/parameters/InvitationID"
    post:
      tags: [Family Invitation]
      summary: Reject an invitation
      security: [{UserBearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationReasonRequest"}
      responses:
        "200": {$ref: "#/components/responses/InvitationOK"}
        "400": {$ref: "#/components/responses/BusinessError"}
  /invitations/{invitationId}/cancel:
    parameters:
      - $ref: "#/components/parameters/InvitationID"
    post:
      tags: [Family Invitation]
      summary: Cancel a pending invitation
      security: [{UserBearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationReasonRequest"}
      responses:
        "200": {$ref: "#/components/responses/InvitationOK"}
        "403": {$ref: "#/components/responses/BusinessError"}
  /users/me/invitations:
    get:
      tags: [Family Invitation]
      summary: List current user's in-app invitations
      security: [{UserBearerAuth: []}]
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationListAPIResponse"}
  /families/{familyId}/join-requests:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    post:
      tags: [Family Join Request]
      summary: Apply to join a family
      security: [{UserBearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateJoinRequest"}
      responses:
        "201": {$ref: "#/components/responses/JoinRequestOK"}
        "400": {$ref: "#/components/responses/BusinessError"}
    get:
      tags: [Family Join Request]
      summary: List family join requests as FOUNDER or FAMILY_ADMIN
      security: [{UserBearerAuth: []}]
      responses:
        "200":
          description: Join request list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JoinRequestListAPIResponse"}
        "403": {$ref: "#/components/responses/BusinessError"}
  /users/me/join-requests:
    get:
      tags: [Family Join Request]
      summary: List current user's join requests
      security: [{UserBearerAuth: []}]
      responses:
        "200":
          description: Join request list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JoinRequestListAPIResponse"}
  /families/{familyId}/join-requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/RequestID"

openapi: 3.0.3
info:
  title: Tree API
  version: 0.7.5
  description: API contract synchronized from the M1-M7 Go router, DTOs, VOs, handlers, and services.
servers:
  - url: http://127.0.0.1:8080/api
tags:
  - name: Health
  - name: Admin Auth
  - name: User Auth
  - name: WeChat Account
  - name: Family
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AdminLoginError"
  /admin/auth/logout:
    post:
      tags: [Admin Auth]
      summary: Revoke current admin token
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SystemError"
  /admin/me:
    get:
      tags: [Admin Auth]
      summary: Get current admin
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfoAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminStateError"
  /admin/me/password:
    put:
      tags: [Admin Auth]
      summary: Change current admin password
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/send-code:
    post:
      tags: [User Auth]
      summary: Send phone verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
      responses:
        "200":
          description: Code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /auth/register-phone:
    post:
      tags: [User Auth]
      summary: Register with phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPhoneRequest"
      responses:
        "200":
          description: User created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /auth/login-phone:
    post:
      tags: [User Auth]
      summary: Login with phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPhoneRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BusinessError"
  /auth/logout:
    post:
      tags: [User Auth]
      summary: Revoke current user token
      security:
        - UserBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SystemError"
  /auth/wechat-mini/login:
    post:
      tags: [WeChat Account]
      summary: Login with WeChat Mini Program code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatMiniLoginRequest"
      responses:
        "200":
          description: Login succeeded or pending-phone-bind user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /auth/wechat-mini/bind-phone:
    post:
      tags: [WeChat Account]
      summary: Bind phone, claim account, or merge account
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindPhoneRequest"
      responses:
        "200":
          description: Phone bound; returns a new user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-phone:
    post:
      tags: [WeChat Account]
      summary: Change current user's phone
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePhoneRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/cancel-account:
    post:
      tags: [WeChat Account]
      summary: Cancel current user account
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /families:
    post:
      tags: [Family]
      summary: Create family
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetailAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Family]
      summary: List current user's families
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Active family memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyListAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/SystemError"
  /families/{familyId}:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family]
      summary: Get member-visible family detail
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Family detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetailAPIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
    put:
      tags: [Family]
      summary: Update family base information
      description: publicDisplayStatus, familySurname, status, founder member, and graphVersion are not writable.
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyRequest"
      responses:
        "200":
          description: Updated family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetailAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/public:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family]
      summary: Get public family information
      description: Returns code 42103 when the family is PRIVATE or otherwise not NORMAL and APPROVED.
      security: []
      responses:
        "200":
          description: Public family information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFamilyAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/dissolution-requests:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    post:
      tags: [Family]
      summary: Create family dissolution request
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDissolutionRequest"
      responses:
        "200":
          description: Pending request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DissolutionAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/dissolution-requests/current:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
    get:
      tags: [Family]
      summary: Get current pending dissolution request
      description: data is null when no pending request exists.
      security:
        - UserBearerAuth: []
      responses:
        "200":
          description: Pending request or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableDissolutionAPIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
  /families/{familyId}/dissolution-requests/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/FamilyID"
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Family]
      summary: Cancel pending family dissolution request
      security:
        - UserBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDissolutionRequest"
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DissolutionAPIResponse"
        "400":
          $ref: "#/components/responses/BusinessError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BusinessError"
        "404":
          $ref: "#/components/responses/BusinessError"
components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: USER token signed with JWT_USER_SECRET and typ=USER.
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ADMIN token signed with JWT_ADMIN_SECRET and typ=ADMIN.
  parameters:
    FamilyID:
      name: familyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestID:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid JSON or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 10001
            message: 参数错误
            data: null
    Unauthorized:
      description: Missing, invalid, expired, wrong-type, or revoked token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 10008
            message: 登录已过期
            data: null
    BusinessError:
      description: Business rule failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SystemError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 10000
            message: 系统错误
            data: null
    AdminLoginError:
      description: Invalid credentials or unusable admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 47001
            message: 用户名或密码错误
            data: null
    AdminStateError:
      description: Admin is disabled, locked, or deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StatusOK:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusAPIResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    StatusAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Status"
    ResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data: {}
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  example: ok
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AdminChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    AdminInfo:
      type: object
      required: [id, username, displayName, role, status]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [ROOT_ADMIN, SUPER_ADMIN, PLATFORM_ADMIN]
        status:
          type: string
    AdminLoginResponse:
      type: object
      required: [accessToken, tokenType, admin]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        admin:
          $ref: "#/components/schemas/AdminInfo"
    AdminLoginAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminLoginResponse"
    AdminInfoAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminInfo"
    SendCodeRequest:
      type: object
      required: [phone, scene, clientType]
      properties:
        phone:
          type: string
        scene:
          type: string
          enum: [REGISTER, LOGIN, BIND_PHONE, CHANGE_PHONE_OLD, CHANGE_PHONE_NEW, CANCEL_ACCOUNT]
        clientType:
          type: string
          description: Required but not enum-validated by the current DTO/service.
    SendCodeResponse:
      type: object
      required: [expireSeconds, cooldownSeconds]
      properties:
        expireSeconds:
          type: integer
        cooldownSeconds:
          type: integer
        devCode:
          type: string
          nullable: true
          description: Present only outside production.
    SendCodeAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SendCodeResponse"
    RegisterPhoneRequest:
      type: object
      required: [phone, code, password, clientType]
      properties:
        phone:
          type: string
        code:
          type: string
        password:
          type: string
          format: password
          minLength: 6
        nickname:
          type: string
          nullable: true
        clientType:
          type: string
    LoginPhoneRequest:
      type: object
      required: [phone, password, clientType]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password
        clientType:
          type: string
    WechatMiniLoginRequest:
      type: object
      required: [code, clientType]
      properties:
        code:
          type: string
        clientType:
          type: string
    BindPhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
    ChangePhoneRequest:
      type: object
      required: [oldPhoneCode, newPhone, newPhoneCode]
      properties:
        oldPhoneCode:
          type: string
        newPhone:
          type: string
        newPhoneCode:
          type: string
    CancelAccountRequest:
      type: object
      required: [phoneCode]
      properties:
        phoneCode:
          type: string
        cancelReason:
          type: string
    UserInfo:
      type: object
      required: [id, phoneVerified, status]
      properties:
        id:
          type: integer
          format: int64
        phone:
          type: string
          nullable: true
        phoneVerified:
          type: boolean
        nickname:
          type: string
          nullable: true
        status:
          type: string
    UserLoginResponse:
      type: object
      required: [accessToken, tokenType, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: "#/components/schemas/UserInfo"
    UserLoginAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserLoginResponse"
    PublicContact:
      type: object
      properties:
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        wechat:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        visible:
          type: boolean
          nullable: true
    CreateFamilyRequest:
      type: object
      required: [surname]
      properties:
        surname:
          type: string
        familyName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: Compatibility alias used only when familyName is blank.
        nativePlace:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        regionText:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        publicContact:
          allOf:
            - $ref: "#/components/schemas/PublicContact"
          nullable: true
    UpdateFamilyRequest:
      type: object
      description: All fields are optional. Explicit blank strings are normalized to null.
      properties:
        familyName:
          type: string
          nullable: true
        nativePlace:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        regionText:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        searchable:
          type: boolean
          nullable: true
        publicContactName:
          type: string
          nullable: true
        publicContactPhone:
          type: string
          nullable: true
        publicContactWechat:
          type: string
          nullable: true
        publicContactNote:
          type: string
          nullable: true
        publicContactVisible:
          type: boolean
          nullable: true
    FamilySummary:
      type: object
      required: [id, familyName, familySurname, status, publicDisplayStatus, role]
      properties:
        id:
          type: integer
          format: int64
        familyName:
          type: string
        familySurname:
          type: string
        nativePlace:
          type: string
          nullable: true
        regionText:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
        publicDisplayStatus:
          type: string
        role:
          type: string
          enum: [FOUNDER, FAMILY_ADMIN, MEMBER]
    FamilyDetail:
      type: object
      required:
        - id
        - familyName
        - familySurname
        - status
        - searchable
        - publicDisplayStatus
        - publicContactVisible
        - graphVersion
        - role
      properties:
        id:
          type: integer
          format: int64
        familyName:
          type: string
        familySurname:
          type: string
        nativePlace:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        regionText:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
        searchable:
          type: boolean
        publicDisplayStatus:
          type: string
        publicContactName:
          type: string
          nullable: true
        publicContactPhone:
          type: string
          nullable: true
        publicContactWechat:
          type: string
          nullable: true
        publicContactNote:
          type: string
          nullable: true
        publicContactVisible:
          type: boolean
        currentFounderMemberId:
          type: integer
          format: int64
          nullable: true
        graphVersion:
          type: integer
          format: int64
        role:
          type: string
    PublicFamily:
      type: object
      required: [id, familyName, familySurname, publicContactVisible]
      properties:
        id:
          type: integer
          format: int64
        familyName:
          type: string
        familySurname:
          type: string
        nativePlace:
          type: string
          nullable: true
        regionText:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        publicContactName:
          type: string
          nullable: true
        publicContactPhone:
          type: string
          nullable: true
        publicContactWechat:
          type: string
          nullable: true
        publicContactNote:
          type: string
          nullable: true
        publicContactVisible:
          type: boolean
    CreateDissolutionRequest:
      type: object
      properties:
        requestReason:
          type: string
          nullable: true
    CancelDissolutionRequest:
      type: object
      properties:
        cancelReason:
          type: string
          nullable: true
    DissolutionRequest:
      type: object
      required: [id, familyId, requesterMemberId, requesterUserId, requestStatus, createdAt]
      properties:
        id:
          type: integer
          format: int64
        familyId:
          type: integer
          format: int64
        requesterMemberId:
          type: integer
          format: int64
        requesterUserId:
          type: integer
          format: int64
        requestStatus:
          type: string
        requestReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    FamilyDetailAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FamilyDetail"
    FamilyListAPIResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/FamilySummary"
    PublicFamilyAPIResponse:
